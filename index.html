<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1720">
<title>Planner</title>
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
:root {
  --bg: #0f1720; --card: #17212c; --line: #223040; --text: #e6edf3; --dim: #8b9bab;
  --accent: #3fa7ff; --good: #3fbf6f; --bad: #ff6b6b; --warn: #f2b84b; --sell: #ff8a65;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
body { padding-bottom: calc(72px + env(safe-area-inset-bottom)); }
header { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 12px 16px 10px;
  display: flex; justify-content: space-between; align-items: center; gap: 12px; }
header .sub { color: var(--dim); font-size: 14px; }
header .sub b { color: var(--text); font-weight: 600; }
main { padding: 4px 16px 12px; max-width: 640px; margin: 0 auto; }
nav { position: fixed; bottom: 0; left: 0; right: 0; display: flex; background: var(--card);
  border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); z-index: 5; }
nav button { flex: 1; background: none; border: 0; color: var(--dim); padding: 10px 0 12px; font-size: 13px; }
nav button b { display: block; font-size: 20px; line-height: 1.2; }
nav button.on { color: var(--accent); }
.card { background: var(--card); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
.card h2 { font-size: 15px; margin: 0 0 10px; }
.big { font-size: 32px; font-weight: 700; line-height: 1.1; }
.dim { color: var(--dim); } .small { font-size: 13px; }
.row { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.tag { font-size: 12px; font-weight: 600; color: var(--accent); margin-left: 6px; }
.buy { color: var(--good); } .sell { color: var(--sell); }
.pair { font-size: 15px; padding: 3px 0; }
.list { margin: 0; padding: 0; list-style: none; font-size: 15px; }
.list li { padding: 6px 0; border-top: 1px solid var(--line); display: flex; gap: 10px; align-items: baseline; }
.list li:first-child { border-top: 0; }
.list .pos { width: 26px; color: var(--dim); font-size: 13px; flex: none; }
.list .team { margin-left: auto; color: var(--dim); font-size: 13px; }
.msg { font-size: 14px; margin: 0 0 12px; padding: 10px 12px; border-radius: 10px; background: #1d2a37; }
.msg.warn { border-left: 3px solid var(--warn); } .msg.info { border-left: 3px solid var(--accent); }
.msg.bad { border-left: 3px solid var(--bad); }
.msg .x { float: right; margin-left: 8px; }
.actions { display: flex; gap: 8px; margin-bottom: 12px; }
.actions .btn { flex: 1; }
button.btn { background: var(--accent); color: #fff; border: 0; border-radius: 12px; padding: 13px 16px; font-size: 16px; font-weight: 600; }
button.btn.ghost { background: var(--card); color: var(--text); font-weight: 500; }
button.btn.full { width: 100%; margin-top: 12px; }
button.btn:disabled { opacity: .45; }
button.link { background: none; border: 0; color: var(--accent); padding: 0; font-size: 14px; }
details > summary { cursor: pointer; color: var(--dim); font-size: 14px; list-style: none; }
details > summary::-webkit-details-marker { display: none; }
details > summary::before { content: "▸ "; } details[open] > summary::before { content: "▾ "; }
details.card > summary { margin: 0; }
details[open] > summary { margin-bottom: 10px; }
pre { white-space: pre-wrap; word-break: break-word; font: 12.5px/1.35 ui-monospace, Consolas, monospace;
  background: #0b1219; border-radius: 8px; padding: 10px; margin: 8px 0 0; max-height: 60vh; overflow: auto; }
label { display: block; font-size: 14px; margin: 12px 0 4px; }
input, textarea { width: 100%; background: #0b1219; color: var(--text); border: 1px solid var(--line);
  border-radius: 10px; padding: 10px; font-size: 16px; font-family: inherit; }
textarea { min-height: 64px; }
.help { color: var(--dim); font-size: 13px; margin-top: 4px; }
#busy { display: none; } #busy.show { display: block; }
.spin { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--accent); border-right-color: transparent;
  border-radius: 50%; animation: s 0.8s linear infinite; vertical-align: -2px; margin-right: 6px; }
@keyframes s { to { transform: rotate(360deg); } }
.swaprow { padding: 10px 0; border-top: 1px solid var(--line); }
.swaprow:first-child { border-top: 0; }
.swaprow label { margin: 0; display: flex; gap: 10px; align-items: center; font-size: 15px; }
.swaprow input[type=checkbox] { width: 22px; height: 22px; flex: none; }
.swaprow input[type=text], .swaprow input:not([type]) { margin-top: 8px; }
.hidden { display: none !important; }
</style>
</head>
<body>
<header>
  <div class="sub" id="sub">Loading…</div>
  <button class="link" style="font-size:22px" onclick="refresh()" title="Reload">↻</button>
</header>
<main>
  <div id="busy" class="card"><span class="spin"></span><b id="busyTitle">Running…</b>
    <div class="small dim" id="busyText"></div></div>
  <div id="err"></div>
  <section id="v-home"></section>
  <section id="v-swap" class="hidden"></section>
  <section id="v-settings" class="hidden"><div id="settingsLists"></div><div id="setupBox"></div></section>
</main>
<nav>
  <button data-v="home" class="on"><b>▦</b>Plan</button>
  <button data-v="swap"><b>⇄</b>Swap</button>
  <button data-v="settings"><b>⚙</b>Settings</button>
</nav>
<script>
"use strict";
/* ------------------------------------------------------------------ storage */
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let cfg = LS.get("cfg", { owner: "", repo: "", token: "" });
let app = LS.get("app", null);          // last data/app.json (offline copy, MOB4)
let appFetchedAt = LS.get("appFetchedAt", null);
let showSaved = false;                  // true = user chose to look at the saved plan while an unsaved preview exists
let running = null;                     // {action, requestId, startedAt, runUrl}

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const d = iso => iso ? `${+iso.slice(8, 10)}.${+iso.slice(5, 7)}.` : "";
const eur = n => n == null ? "–" : Math.round(n).toLocaleString("fi-FI").replace(/ /g, " ") + " €";
const todayIso = () => { const t = new Date(); return new Date(t - t.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
const ago = iso => { if (!iso) return "never"; const m = Math.round((Date.now() - new Date(iso)) / 6e4);
  return m < 1 ? "just now" : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} d ago`; };

/* ------------------------------------------------- messages (MOB6, like PC) */
function fmtValue(v, spec) {
  if (!spec) return String(v);
  if (typeof v !== "number") return String(v);
  let s = spec.includes(",") ? Math.abs(v).toLocaleString("en-US") : String(Math.abs(v));
  if (v < 0) s = "-" + s; else if (spec.includes("+")) s = "+" + s;
  return s;
}
function render(item) {
  const msgs = (app && app.messages) || {};
  const t = msgs[item.code];
  if (!t) return `${item.code} ${JSON.stringify(Object.fromEntries(Object.entries(item).filter(([k]) => k !== "code")))}`;
  return t.replace(/\{(\w+)(?::([^}]*))?\}/g, (m, k, spec) => k in item ? fmtValue(item[k], spec) : m);
}

/* ------------------------------------------------------------- GitHub API */
const API = "https://api.github.com";
function headers(extra = {}) {
  return { "Authorization": "Bearer " + cfg.token, "X-GitHub-Api-Version": "2022-11-28", ...extra };
}
async function gh(path, opts = {}) {
  const r = await fetch(API + path, { cache: "no-store", ...opts, headers: headers(opts.headers || {}) });
  if (!r.ok) {
    let detail = ""; try { detail = (await r.json()).message || ""; } catch {}
    const hint = r.status === 401 ? " (token wrong or expired → Settings → Connection)" : r.status === 403 ? " (token lacks a permission → Settings → Connection)"
      : r.status === 404 ? " (owner/repo name wrong, or token has no access to this repo → Settings → Connection)" : "";
    throw new Error(`GitHub ${r.status}: ${detail}${hint}`);
  }
  return r;
}
const repoPath = () => `/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}`;

async function loadApp() {
  const r = await gh(`${repoPath()}/contents/data/app.json?ref=main&t=${Date.now()}`,
    { headers: { Accept: "application/vnd.github.raw+json" } });
  app = await r.json();
  appFetchedAt = new Date().toISOString();
  LS.set("app", app); LS.set("appFetchedAt", appFetchedAt);
}

async function dispatch(action, extra = {}) {
  const requestId = "r" + Date.now().toString(36);
  await gh(`${repoPath()}/actions/workflows/app.yml/dispatches`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ ref: "main", inputs: { action, request_id: requestId, ...extra } }),
  });
  return requestId;
}

async function findRun(requestId) {
  const r = await gh(`${repoPath()}/actions/workflows/app.yml/runs?event=workflow_dispatch&per_page=15`);
  const j = await r.json();
  return (j.workflow_runs || []).find(w => (w.display_title || w.name || "").includes(requestId));
}

/* ------------------------------------------------------------ run an action */
const ACTION_TEXT = {
  "run": "Daily run", "preview-next": "Period start", "save-next": "Save period start",
  "preview-now": "Preview this period", "save-now": "Save this period", "swap": "Save swaps", "set-cash": "Set cash",
  "settings": "Save lists", "check-sources": "Check sources", "state": "Refresh data",
};
async function runAction(action, extra = {}, afterView = "home") {
  if (running) return alert("Wait: another action is still running.");
  if (!ready()) return show("setup");
  running = { action, startedAt: Date.now() };
  busy(true);
  let t0 = Date.now(), tick = setInterval(() => busyText(), 1000);
  try {
    running.requestId = await dispatch(action, extra);
    busyText("Waiting for GitHub…");
    let run = null, n = 0;
    while (true) {
      await sleep(n < 3 ? 4000 : 6000); n++;
      if (Date.now() - t0 > 12 * 60 * 1000) throw new Error("Timed out after 12 min. Check the Actions tab on GitHub.");
      try { run = await findRun(running.requestId); } catch (e) { if (!navigator.onLine) continue; throw e; }
      if (!run) continue;
      running.runUrl = run.html_url;
      if (run.status === "completed") break;
    }
    busyText("Loading results…");
    $("#err").innerHTML = "";                       // old notes are no longer true
    await sleep(1500);
    await loadApp();
    const la = app.last_action || {};
    if (run.conclusion !== "success" && la.ok !== false) {
      flash(`GitHub run ended: ${run.conclusion}. <a href="${esc(run.html_url)}" target="_blank" rel="noopener">Open log</a>`, "bad");
    }
    showSaved = false;
    if (la.ok !== false && run.conclusion === "success" && ["swap", "set-cash", "settings", "state", "check-sources"].includes(action))
      flash(`${ACTION_TEXT[action]} ✓${action === "check-sources" ? " Report: Settings → Last action." : ""}`);
    show(la.ok === false ? "home" : afterView);
  } catch (e) {
    flash(esc(e.message) + (running && running.runUrl ? ` <a href="${esc(running.runUrl)}" target="_blank" rel="noopener">Open log</a>` : ""), "bad");
  } finally {
    clearInterval(tick); running = null; busy(false); renderAll();
  }
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
function busy(on) { $("#busy").classList.toggle("show", on); if (on) { $("#busyTitle").textContent = ACTION_TEXT[running.action] + "…"; busyText("Sending…"); }
  document.querySelectorAll("button.btn").forEach(b => b.disabled = on); }
function busyText(t) { if (t) running && (running.note = t); if (!running) return;
  const s = Math.round((Date.now() - running.startedAt) / 1000);
  $("#busyText").textContent = `${running.note || ""} ${s} s (usually 40–90 s)`; }
function flash(html, kind = "info") { $("#err").innerHTML = `<div class="msg ${kind}"><button class="link x" onclick="this.parentElement.remove()">✕</button>${html}</div>`; }

/* --------------------------------------------------------------- views */
const VIEWS = ["home", "swap", "settings"];
function show(v) {
  if (v === "setup") { show("settings"); setTimeout(() => { const c = $("#conn"); if (c) { c.open = true; c.scrollIntoView(); } }, 0); return; }
  if (!VIEWS.includes(v)) v = "home";                   // old saved names: plan, actions
  document.querySelectorAll("main > section").forEach(s => s.classList.toggle("hidden", s.id !== "v-" + v));
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.v === v));
  LS.set("view", v); window.scrollTo(0, 0);
}
function ready() { return cfg.owner && cfg.repo && cfg.token; }
const swapsLeft = st => st.swaps_used == null ? "–" : st.swaps_total - st.swaps_used;

function renderHeader() {
  const st = app && app.state;
  const off = navigator.onLine ? "" : `<span style="color:var(--warn)">Offline · </span>`;
  if (!st) { $("#sub").innerHTML = off + (ready() ? "No data yet. Tap ↻" : "Start: Settings → Connection"); return; }
  $("#sub").innerHTML = `${off}Swaps left <b>${swapsLeft(st)}</b> · Cash <b>${eur(st.leftover_cash)}</b> · <span title="data updated">${ago(app.updated_at)}</span>`;
}

function planPositions(res) {
  const pos = {};
  ((app.state && app.state.roster) || []).forEach(p => pos[p.name] = p.position);
  (res.segments || []).forEach(s => s.players.forEach(p => pos[p.name] = p.position));
  return pos;
}
// pair each sold player with the bought player of the same position
function pairs(seg, pos) {
  const ins = [...(seg.in || [])];
  const out = (seg.out || []).map(o => { const k = ins.findIndex(n => pos[n] === pos[o]); return [o, k >= 0 ? ins.splice(k, 1)[0] : null]; });
  ins.forEach(n => out.push([null, n]));
  return out.map(([o, i]) => `<div class="pair">${o ? `<span class="sell">${esc(o)}</span>` : ""}${o && i ? " → " : ""}${i ? `<span class="buy">${esc(i)}</span>` : ""}</div>`).join("");
}
function playerList(players, ins = []) {
  return `<ul class="list">` + players.map(p => `<li><span class="pos">${esc(p.position)}</span>
    <span>${ins.includes(p.name) ? "<span class='buy'>●</span> " : ""}${esc(p.name)}</span><span class="team">${esc(p.team)}</span></li>`).join("") + `</ul>`;
}

function previewPending() {                            // an unsaved period preview newer than the saved plan?
  const p = app && app.preview, r = app && app.result;
  if (!p) return false;
  if (!r) return true;
  return String(p.computed_at || "") > String(r.computed_at || "");
}

function renderHome() {
  const el = $("#v-home");
  const la = app && app.last_action;
  let h = "";
  if (la && la.ok === false) {
    h += `<div class="msg bad"><b>Last action failed</b> · ${esc(ago(la.finished_at))}
      <details style="margin-top:6px"><summary>Show log</summary><pre>${esc(la.output || "(no output)")}</pre></details></div>`;
  }
  h += `<div class="actions"><button class="btn" onclick="runAction('run')">▶ Daily run</button>
    <button class="btn ghost" onclick="runAction('preview-next')">Period start</button></div>`;
  if (!app) {
    h += `<div class="card">${ready() ? `No data yet.<button class="btn full" onclick="runAction('state')">Create data</button>` : `Connect first: <b>Settings → Connection</b>.`}</div>`;
    el.innerHTML = h; return;
  }

  const pending = previewPending() && !showSaved;
  const res = pending ? app.preview : app.result;
  const roster = (app.state && app.state.roster) || [];
  if (!res) {
    h += `<div class="card"><h2>My team</h2>${roster.length ? playerList(roster) : `<div class="dim small">No team saved yet.</div>`}</div>
      <div class="card dim small">No plan yet. Tap <b>Daily run</b> (during a period) or <b>Period start</b>.</div>`;
    el.innerHTML = h; return;
  }
  const today = todayIso(), segs = res.segments || [], pos = planPositions(res);

  // ---- 1. what to do now
  if (pending) {
    const first = segs[0];
    h += `<div class="card"><h2>Period start · not saved</h2>
      <div class="small dim" style="margin-bottom:8px">Buy exactly these 6 on the site, then tap Save.</div>
      ${first ? playerList(first.players) : ""}
      <button class="btn full" onclick="savePeriod()">I bought these 6 → Save</button>
      ${app.result ? `<div style="margin-top:10px;text-align:center"><button class="link" onclick="showSaved=true;renderHome()">Show saved plan instead</button></div>` : ""}</div>`;
  } else {
    if (previewPending()) h += `<div class="msg info">Unsaved period start exists. <button class="link" onclick="showSaved=false;renderHome()">Show it</button></div>`;
    const swapSegs = segs.filter((s, i) => s.in && s.in.length && !(i === 0 && res.mode === "free_start"));
    const next = swapSegs.find(s => s.dates[0] >= today);
    h += `<div class="card">`;
    if (next && next.dates[0] === today) h += `<h2>Swap today, before the first game</h2>${pairs(next, pos)}`;
    else if (next) h += `<h2>No swaps today</h2><div class="dim small">Next swaps on ${d(next.dates[0])}</div>`;
    else h += `<h2>No swaps today</h2><div class="dim small">No more swaps planned this period.</div>`;
    h += `</div>`;
    if (String(res.computed_at || "").slice(0, 10) < today)
      h += `<div class="msg warn">Plan is from ${d(res.computed_at)}. Tap <b>Daily run</b> for a fresh one.</div>`;
  }

  // ---- 2. plan summary
  h += `<div class="card"><div class="row"><div><div class="big">${Math.round(res.total_points)}</div>
    <div class="dim small">points ${res.mode === "free_start" ? "for the whole period" : "for the rest of the period"}</div></div>
    <div class="dim small" style="text-align:right">swaps<br><b style="color:var(--text);font-size:18px">${res.swaps_planned ?? 0} / ${res.swaps_left ?? 0}</b></div></div></div>`;

  // ---- 3. timeline (current/next window open, others collapsed)
  const openIdx = Math.max(0, segs.findIndex(s => s.dates[s.dates.length - 1] >= today));
  segs.forEach((s, i) => {
    if (pending && i === 0) return;                    // shown above
    const first = s.dates[0], last = s.dates[s.dates.length - 1];
    const now = first <= today && today <= last;
    const swaps = s.in && s.in.length && !(i === 0 && res.mode === "free_start");
    const head = `${d(first)}–${d(last)}${now ? `<span class="tag">NOW</span>` : ""}`;
    h += `<details class="card"${i === openIdx ? " open" : ""}><summary><span style="color:var(--text);font-weight:600">${head}</span>
      <span style="float:right">${Math.round(s.points)} p</span></summary>
      ${swaps ? `<div style="margin-bottom:8px">${pairs(s, pos)}</div>` : ""}
      ${playerList(s.players, swaps ? s.in : [])}</details>`;
  });

  // ---- 4. notes (warnings + info), collapsed
  const notes = [...(res.gate ? [res.gate] : []), ...(res.events || []), ...(res.warnings || [])];
  if (notes.length) h += `<details class="card"><summary>Notes (${notes.length})</summary>
    ${notes.map(n => `<div class="small" style="padding:4px 0">${esc(render(n))}</div>`).join("")}</details>`;
  el.innerHTML = h;
}
function savePeriod() {
  const p = app && app.preview;
  const names = p && p.segments && p.segments[0] ? p.segments[0].players.map(x => x.name).join(", ") : "(no preview yet)";
  if (!confirm(`Save the period start?\n\nOnly AFTER you bought exactly these 6 on the site:\n${names}\n\n(The save re-calculates with fresh data; if the 6 changed, fix it with Swap.)`)) return;
  runAction("save-next");
}

/* ------------------------------------------------------------------ swap */
function renderSwap() {
  const el = $("#v-swap");
  if (!app) { el.innerHTML = `<div class="card dim">No data yet.</div>`; return; }
  const roster = app.state.roster || [];
  let h = `<div class="card"><div class="row"><h2>Log my swaps</h2><button class="link" onclick="fillFromPlan()">Fill from plan</button></div>
    <div class="help" style="margin:-4px 0 6px">Tick who you sold, type who you bought (part of the name is enough).</div><div id="swaprows">`;
  roster.forEach((p, i) => {
    h += `<div class="swaprow"><label>
      <input type="checkbox" id="so${i}" onchange="$('#si${i}').classList.toggle('hidden',!this.checked)">
      <span>${esc(p.name)} <span class="dim small">${esc(p.position)}</span></span></label>
      <input id="si${i}" class="hidden" placeholder="bought (${esc(p.position)})" autocomplete="off" autocapitalize="words"></div>`;
  });
  h += `</div><label for="swapcash">Cash on the site now <span class="dim">(optional)</span></label>
    <input id="swapcash" inputmode="numeric" placeholder="empty = calculate" autocomplete="off">
    <button class="btn full" onclick="sendSwaps()">Save swaps</button></div>
    <details class="card"><summary>Cash wrong? (here ${eur(app.state.leftover_cash)})</summary>
    <input id="fixcash" inputmode="numeric" placeholder="cash on the site, e.g. 12000" autocomplete="off">
    <button class="btn full" onclick="sendCash()">Set cash</button></details>`;
  el.innerHTML = h;
}
function fillFromPlan() {
  const res = app.result;
  if (!res || !res.segments) return alert("No saved plan.");
  const today = todayIso();
  const seg = res.segments.find(s => s.in && s.in.length && s.dates[0] >= today) || res.segments.find(s => s.in && s.in.length);
  if (!seg) return alert("The plan has no swaps.");
  const pos = planPositions(res), roster = app.state.roster || [];
  const ins = [...seg.in];
  roster.forEach((p, i) => {
    const on = seg.out.includes(p.name);
    $("#so" + i).checked = on; $("#si" + i).classList.toggle("hidden", !on); $("#si" + i).value = "";
    if (on) { const k = ins.findIndex(n => pos[n] === p.position); if (k >= 0) { $("#si" + i).value = ins[k]; ins.splice(k, 1); } }
  });
  flash(`Filled from the plan for ${d(seg.dates[0])}. Check it matches what you did.`);
}
function sendSwaps() {
  const roster = app.state.roster || [], pairs = [];
  for (let i = 0; i < roster.length; i++) {
    if (!$("#so" + i).checked) continue;
    const inn = $("#si" + i).value.trim();
    if (!inn) return alert(`Who did you buy for ${roster[i].name}?`);
    if (/[>;]/.test(inn)) return alert("Names cannot contain > or ;");
    pairs.push(`${roster[i].name}>${inn}`);
  }
  if (!pairs.length) return alert("Tick at least one sold player.");
  const cash = cleanCash($("#swapcash").value);
  if (cash === false) return alert("Cash must be a whole number of euros, e.g. 12000 (or leave it empty).");
  if (!confirm("Save these swaps?\n\n" + pairs.map(p => p.replace(">", "  →  ")).join("\n")
      + "\n\nCash: " + (cash === "" ? "calculate" : eur(+cash)))) return;
  runAction("swap", { pairs: pairs.join("; "), cash }, "home");
}
// "12 000 €" -> "12000"; "" -> "" (not given); false = not a whole number >= 0
function cleanCash(text) {
  const t = String(text || "").replace(/[\s €]|eur/gi, "");
  if (!t) return "";
  return /^\d+$/.test(t) ? String(+t) : false;
}
function sendCash() {
  const cash = cleanCash($("#fixcash").value);
  if (cash === "" || cash === false) return alert("Type the cash the site shows, whole euros, e.g. 12000.");
  if (!confirm(`Set cash to ${eur(+cash)}?\n\nNow: ${eur(app.state.leftover_cash)}`)) return;
  runAction("set-cash", { cash }, "swap");
}

/* -------------------------------------------------------------- settings */
// Only the player/team lists are shown. Every other setting is sent back unchanged.
const LIST_ORDER = ["fix_players", "fix_game_days", "include_players", "exclude_players", "exclude_teams"];
const LIST_TITLES = { fix_players: "Fix players", fix_game_days: "Fix game days", include_players: "Include players",
  exclude_players: "Exclude players", exclude_teams: "Exclude teams" };
function renderSettings() {
  const el = $("#settingsLists");
  if (!app || !app.settings_schema || !app.settings_schema.lists) { el.innerHTML = ""; return; }
  const S = app.settings.lists, sch = app.settings_schema.lists;
  const keys = [...LIST_ORDER.filter(k => k in sch), ...Object.keys(sch).filter(k => !LIST_ORDER.includes(k))];
  let h = "";
  (app.settings_warnings || []).forEach(w => h += `<div class="msg warn">${esc(render(w))}</div>`);
  h += `<div class="card"><h2>Player and team lists</h2>`;
  for (const k of keys) {
    const f = sch[k], id = `set-lists-${k}`, v = S[k];
    const title = LIST_TITLES[k] || esc(k);
    const help = f.description ? `<div class="help">${esc(f.description)}</div>` : "";
    if (f.type === "list") h += `<label for="${id}">${title}</label><textarea id="${id}" placeholder="one name per line">${esc((v || []).join("\n"))}</textarea>${help}`;
    else h += `<label for="${id}">${title}</label><input id="${id}" inputmode="decimal" value="${esc(v)}">${help}`;
  }
  h += `<button class="btn full" onclick="saveSettings()">Save lists</button></div>`;
  el.innerHTML = h;
}
function collectSettings() {
  const S = JSON.parse(JSON.stringify(app.settings)), sch = app.settings_schema.lists;
  for (const [k, f] of Object.entries(sch)) {
    const el = document.getElementById(`set-lists-${k}`); if (!el) continue;
    if (f.type === "list") S.lists[k] = el.value.split("\n").map(s => s.trim()).filter(Boolean);
    else if (f.type === "int" || f.type === "float") {
      const n = Number(String(el.value).replace(",", ".").replace(/\s/g, ""));
      if (!isFinite(n) || el.value.trim() === "") throw new Error(`${LIST_TITLES[k] || k} must be a number`);
      S.lists[k] = n;
    } else S.lists[k] = el.value;
  }
  return S;
}
function saveSettings() {
  let S; try { S = collectSettings(); } catch (e) { return alert(e.message); }
  const changes = [];
  for (const k in S.lists) if (JSON.stringify(S.lists[k]) !== JSON.stringify(app.settings.lists[k]))
    changes.push(`${LIST_TITLES[k] || k}: ${JSON.stringify(app.settings.lists[k])} → ${JSON.stringify(S.lists[k])}`);
  if (!changes.length) return alert("Nothing changed.");
  if (!confirm("Save these changes?\n\n" + changes.join("\n"))) return;
  runAction("settings", { settings_json: JSON.stringify(S) }, "settings");
}

/* ----------------------------------------------------------------- setup (end of Settings) */
function renderSetup() {
  const la = app && app.last_action;
  $("#setupBox").innerHTML = `<details class="card" id="conn"${ready() ? "" : " open"}><summary>Connection${ready() ? " ✓" : ""}</summary>
    <label for="c-owner" style="margin-top:0">GitHub user name</label><input id="c-owner" value="${esc(cfg.owner)}" autocapitalize="off" autocomplete="off">
    <label for="c-repo">Private repo name</label><input id="c-repo" value="${esc(cfg.repo)}" autocapitalize="off" autocomplete="off">
    <label for="c-token">Token</label><input id="c-token" type="password" value="${esc(cfg.token)}" autocapitalize="off" autocomplete="off" placeholder="github_pat_…">
    <div class="help">Fine-grained token, only this repo: Contents = Read, Actions = Read and write. Stored only on this phone.</div>
    <div style="display:flex;gap:8px;margin-top:12px"><button class="btn" style="flex:1" onclick="saveCfg()">Save & test</button>
    <button class="btn ghost" onclick="forget()">Forget token</button></div></details>
    <details class="card"><summary>Maintenance</summary>
    <div style="display:flex;gap:8px"><button class="btn ghost" style="flex:1" onclick="runAction('check-sources',{},'settings')">Check sources</button>
    <button class="btn ghost" style="flex:1" onclick="runAction('state',{},'home')">Refresh data</button></div>
    <div class="help">Check sources: tests every data download. Refresh data: rebuilds the data file, no calculation.</div>
    ${la ? `<details style="margin-top:12px"><summary>Last action: ${esc(la.command)} · ${la.ok === false ? "failed" : "OK"} · ${esc(ago(la.finished_at))}</summary><pre>${esc(la.output || "(no output)")}</pre></details>` : ""}
    <div class="help" style="margin-top:12px">Offline copy from ${esc(appFetchedAt ? appFetchedAt.replace("T", " ").slice(0, 16) : "–")} · app v3</div></details>`;
}
async function saveCfg() {
  cfg = { owner: $("#c-owner").value.trim(), repo: $("#c-repo").value.trim(), token: $("#c-token").value.trim() };
  LS.set("cfg", cfg);
  try { await gh(repoPath()); }                       // 1) can the token see the repo at all?
  catch (e) { return flash(e.message.startsWith("GitHub 404")
      ? "Repo not found. Check: user name and repo name spelled right, and the token was made with " +
        "<b>Only select repositories → your private repo</b>. " + esc(e.message) : esc(e.message), "bad"); }
  try { await loadApp(); flash("Connected ✓", "info"); renderAll(); show("home"); }
  catch (e) {                                          // 2) repo OK, data file missing?
    if (e.message.startsWith("GitHub 404")) {
      flash("Connected ✓ No data file yet. Creating it now (about 1 min)…", "info");
      renderAll(); show("home"); runAction("state");
    } else flash(esc(e.message), "bad");
  }
}
function forget() { if (!confirm("Remove the token from this phone?")) return; cfg.token = ""; LS.set("cfg", cfg); renderSetup(); }

async function refresh() {
  if (!ready()) return show("setup");
  try { await loadApp(); $("#err").innerHTML = ""; renderAll(); }
  catch (e) { flash(esc(e.message) + (e.message.startsWith("GitHub 404") ? " If the connection is OK, tap Settings → Maintenance → <b>Refresh data</b>." : "") + (app ? " Showing the saved copy." : ""), "bad"); }
}
function renderAll() { renderHeader(); renderHome(); renderSwap(); renderSettings(); renderSetup(); }

/* ------------------------------------------------------------------ start */
document.querySelectorAll("nav button").forEach(b => b.onclick = () => show(b.dataset.v));
window.addEventListener("online", () => { renderHeader(); refresh(); });
window.addEventListener("offline", renderHeader);
document.addEventListener("visibilitychange", () => { if (!document.hidden && !running && ready() && navigator.onLine) refresh(); });
renderAll();
show(ready() ? LS.get("view", "home") : "setup");
if (ready() && navigator.onLine) refresh();
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "127.0.0.1")) navigator.serviceWorker.register("sw.js");
</script>
